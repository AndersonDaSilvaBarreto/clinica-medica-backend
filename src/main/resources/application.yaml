spring:
  application:
    name: clinica-medica-backend
  profiles:
    active: dev
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
  threads:
    virtual:
      enabled: true
  main:
    keep-alive: true
  cache:
    type: redis
    redis:
      time-to-live: 10m
jwt:
    secret: ${JWT_SECRET:my_secret}
resend:
  api-key: ${RESEND_API_KEY:re_18TYmEwj_3aHzC4RpWfXSSPk27zNb4QxQ}
  from: ${RESEND_FROM:onboarding@resend.dev}
app:
  cookie:
    domain: ${DOMINIO_URL:}
mercadopago:
  access-token: ${ACCESS-TOKEN:}